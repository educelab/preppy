stages:
  - test
  - deploy

### Tests ###
.test:
  before_script:
    - curl -fsSL https://deb.nodesource.com/setup_19.x | bash -
    - apt update
    - apt install -y imagemagick nodejs
    - apt upgrade -y
    - python -m pip install --upgrade pip setuptools wheel
    - npm install -g obj2gltf gltf-pipeline
  script:
    - python -m pip install .
    - voyager-preppy -h
  tags:
    - docker

test:3.9:
  extends: .test
  stage: test
  image: python:3.9

test:3.10:
  extends: .test
  stage: test
  image: python:3.10