stages:
  - test

# ===========================================================================
# Python package (preppy/)
# ---------------------------------------------------------------------------
# The pure-Python logic is covered here across supported interpreters. Tests
# that need the external toolchain (magick/ktx/gltfpack/node), pymeshlab, or an
# offscreen-GL backend self-skip when those are absent, so a bare runner still
# gets full logic coverage plus the historic `voyager-preppy -h` smoke test.
# ===========================================================================
.py-test:
  stage: test
  before_script:
    - python -m pip install --upgrade pip setuptools wheel
  script:
    - pip install '.[test]'
    - python -m pytest tests/
    - voyager-preppy -h

py:3.11:
  extends: .py-test
  image: python:3.11

py:3.12:
  extends: .py-test
  image: python:3.12

py:3.13:
  extends: .py-test
  image: python:3.13

# Full end-to-end run over the sample object, exercising the real toolchain.
# Heavy and environment-sensitive, so it is opt-in (manual) and non-blocking;
# whatever tools install successfully are exercised, the rest self-skip. See
# README / singularity/dri-voyager-preppy.def for the authoritative install.
integration:
  stage: test
  image: python:3.13
  when: manual
  allow_failure: true
  before_script:
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
    - apt-get update
    - apt-get install -y imagemagick
    - npm install -g gltfpack
    # KTX-Software (>= v5, `ktx create`) — install per README for full KTX2 tests;
    # absent, the KTX2/embed integration tests skip cleanly.
  script:
    - pip install '.[test,validate,preview]'
    - npm install --prefix preppy/node
    - python -m pytest tests/
